name: Deploy to G5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: C:\virtual-try-on
    steps:
      - name: Pull latest code
        run: git -C $env:APP_DIR pull origin main

      # Restarting is delegated to start_all.ps1 so there is exactly one
      # definition of how each backend starts. This step used to inline that
      # logic and had already drifted from it.
      #
      # It also used to open with:
      #     Stop-Process -Name python -Force
      # which kills EVERY python process on the box — including a backend
      # someone is mid-way through debugging, and any unrelated script. Two
      # people share this instance, so a push by one would silently kill the
      # other's work. start_all.ps1 -Force instead kills only the process
      # holding each service's port.
      - name: Restart backends
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if (-not $env:HF_TOKEN) {
            Write-Host "::warning::HF_TOKEN secret is empty - Try-On will fall back to a tier that masks poorly."
          }
          & powershell -ExecutionPolicy Bypass -File "$env:APP_DIR\start_all.ps1" -Force

      # The restart step's own status block can mislead: its error-log tails
      # may be stale from a previous boot. This shows what is really there.
      - name: What is actually running
        if: always()
        run: |
          "--- python processes ---"
          Get-Process python* -ErrorAction SilentlyContinue | Select-Object Id,StartTime,Path | Format-Table -AutoSize | Out-String -Width 200
          "--- listening on backend ports ---"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 7860,7862,8000,7863 } | Select-Object LocalPort,OwningProcess | Format-Table -AutoSize | Out-String
          "--- C:\logs ---"
          Get-ChildItem C:\logs -Filter *.log | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize | Out-String
          "--- try-on.err.log (tail 15) ---"
          Get-Content C:\logs\try-on.err.log -Tail 15 -ErrorAction SilentlyContinue
