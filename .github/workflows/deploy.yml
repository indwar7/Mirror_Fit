name: Deploy to G5

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C C:\virtual-try-on pull origin main

      - name: Restart backends
        run: |
          Stop-Process -Name python -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          New-Item -ItemType Directory -Force -Path C:\logs | Out-Null
          Start-Process -FilePath "C:\miniconda3\python.exe" `
            -ArgumentList "C:\virtual-try-on\tryon_backend\server.py" `
            -WorkingDirectory "C:\virtual-try-on\tryon_backend" `
            -RedirectStandardOutput "C:\logs\tryon.log" `
            -RedirectStandardError "C:\logs\tryon_err.log"
          Start-Sleep -Seconds 2
          Start-Process -FilePath "C:\miniconda3\python.exe" `
            -ArgumentList "-m uvicorn main:app --host 0.0.0.0 --port 7860 --workers 1" `
            -WorkingDirectory "C:\virtual-try-on\face_swap_backend" `
            -RedirectStandardOutput "C:\logs\faceswap.log" `
            -RedirectStandardError "C:\logs\faceswap_err.log"
          Write-Host "Backends restarted. Logs at C:\logs\"
