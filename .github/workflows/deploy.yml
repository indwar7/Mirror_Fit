name: Deploy to G5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: C:\virtual-try-on
    steps:
      - name: Pull latest code
        run: git -C $env:APP_DIR pull origin main

      # Restarting is delegated to start_all.ps1 so there is exactly one
      # definition of how each backend starts. This step used to inline that
      # logic and had already drifted from it.
      #
      # It also used to open with:
      #     Stop-Process -Name python -Force
      # which kills EVERY python process on the box — including a backend
      # someone is mid-way through debugging, and any unrelated script. Two
      # people share this instance, so a push by one would silently kill the
      # other's work. start_all.ps1 -Force instead kills only the process
      # holding each service's port.
      - name: Restart backends
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if (-not $env:HF_TOKEN) {
            Write-Host "::warning::HF_TOKEN secret is empty — Try-On will fall back to a tier that masks poorly."
          }
          & powershell -ExecutionPolicy Bypass -File "$env:APP_DIR\start_all.ps1" -Force
