# Read-only health check of the GPU box, run from a Mac:
#
#   gh workflow run diag.yml --ref main && gh run watch
#
# No inputs on purpose - it runs a fixed set of read-only commands, so it
# cannot be used to run arbitrary code on the box. Use it to see what
# deploy.yml actually left running (ports, processes, log tails), which the
# deploy log alone cannot tell you because its tails may be stale.
name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Who and where
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          "user      : " + (whoami)
          "ps        : " + $PSVersionTable.PSVersion
          "profile   : " + $env:USERPROFILE
          "hf cache  : " + (Test-Path "$env:USERPROFILE\.cache\huggingface\hub")
          "HF_TOKEN  : job=" + [bool]$env:HF_TOKEN + " machine=" + [bool][Environment]::GetEnvironmentVariable("HF_TOKEN","Machine")
          "tracking  : " + $env:RUNNER_TRACKING_ID
          Get-CimInstance Win32_Service -Filter "Name like 'actions.runner%'" | Format-List Name,StartName,State,StartMode | Out-String

      - name: Backends
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          "--- python processes ---"
          Get-Process python* -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,StartTime,Path | Format-Table -AutoSize | Out-String -Width 200
          "--- listening on backend ports ---"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 7860,7862,8000,7863 } | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize | Out-String
          "--- GPU ---"
          & nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu --format=csv 2>&1 | Out-String
          "--- interpreters ---"
          "miniconda python : " + (Test-Path C:\miniconda3\python.exe)
          "repo head        : " + (git -C C:\virtual-try-on log -1 --oneline)

      - name: Logs
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          "===== interactive sessions (an existing Administrator session swallows an RDP alternate shell) ====="
          & query session 2>&1 | Out-String
          Get-ChildItem C:\logs -Recurse | Select-Object FullName,Length,LastWriteTime | Sort-Object LastWriteTime | Format-Table -AutoSize | Out-String -Width 160
          "===== start_all_rdp.log (startup via RDP alternate shell) ====="
          Get-Content C:\logs\start_all_rdp.log -ErrorAction SilentlyContinue
          foreach ($n in "try-on","face-swap") {
            foreach ($f in (Get-ChildItem C:\logs -Recurse -Filter "$n.err.log" -ErrorAction SilentlyContinue)) {
              "===== $($f.FullName) (tail 25) ====="
              Get-Content $f.FullName -Tail 25 -ErrorAction SilentlyContinue
            }
            foreach ($f in (Get-ChildItem C:\logs -Recurse -Filter "$n.log" -ErrorAction SilentlyContinue)) {
              "===== $($f.FullName) (tail 10) ====="
              Get-Content $f.FullName -Tail 10 -ErrorAction SilentlyContinue
            }
          }

      - name: Disk and model caches
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          "--- disk ---"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize | Out-String
          "--- machine env ---"
          foreach ($v in "HF_HOME","HF_HUB_CACHE","HUGGINGFACE_HUB_CACHE","HF_TOKEN") {
            $x = [Environment]::GetEnvironmentVariable($v, "Machine")
            if ($v -eq "HF_TOKEN") { $x = if ($x) { "set" } else { "" } }
            "$v = $x"
          }
          function DirGB($d) { if (Test-Path $d) { [math]::Round(((Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum)/1GB,1) } else { "missing" } }
          "--- candidate HF caches (GB) ---"
          foreach ($d in "C:\Users\Administrator\.cache\huggingface","C:\Windows\ServiceProfiles\NetworkService\.cache\huggingface","C:\hf-cache","C:\huggingface","C:\virtual-try-on\hf-cache","C:\models") {
            "$d : " + (DirGB $d)
            if (Test-Path "$d\hub") { "   hub: " + ((Get-ChildItem "$d\hub" -Directory -ErrorAction SilentlyContinue | ForEach-Object Name) -join ", ") }
          }
          "--- can this account read the Administrator cache? ---"
          try { $n = (Get-ChildItem C:\Users\Administrator\.cache\huggingface\hub -ErrorAction Stop | Measure-Object).Count; "yes, $n entries" } catch { "no: " + $_.Exception.Message }
          & icacls C:\Users\Administrator 2>&1 | Out-String
          "--- biggest top-level folders on C: (GB) ---"
          Get-ChildItem C:\ -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { [pscustomobject]@{ Dir=$_.FullName; GB=(DirGB $_.FullName) } } | Sort-Object { [double]($_.GB -replace 'missing','0') } -Descending | Select-Object -First 12 | Format-Table -AutoSize | Out-String

      - name: Spawn test
        shell: powershell
        run: |
          # Same Start-Process shape as start_all.ps1, with a harmless command,
          # to see whether redirected spawning works at all under this account.
          $ErrorActionPreference = "Continue"
          Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
          Start-Process -FilePath cmd.exe -ArgumentList "/c echo spawned-ok-$(Get-Date -Format HHmmss)" -WorkingDirectory C:\ `
            -RedirectStandardOutput C:\logs\diag.log -RedirectStandardError C:\logs\diag.err.log -WindowStyle Hidden -Wait
          "diag.log: " + (Get-Content C:\logs\diag.log -ErrorAction SilentlyContinue)
          "diag.err: " + (Get-Content C:\logs\diag.err.log -ErrorAction SilentlyContinue)

      - name: Python under this account
        shell: powershell
        run: |
          # The backends spawn with a PID and die without writing a byte to
          # their redirected logs. Find out whether python even runs here.
          $ErrorActionPreference = "Continue"
          "PATH: " + $env:PATH
          "--- direct: python version ---"
          & C:\miniconda3\python.exe -c "import sys; print(sys.version); print(sys.executable)" 2>&1 | Out-String
          "exit: $LASTEXITCODE"
          "--- direct: import torch ---"
          & C:\miniconda3\python.exe -c "import torch; print(torch.__version__, torch.cuda.is_available())" 2>&1 | Out-String
          "exit: $LASTEXITCODE"
          "--- Start-Process python with redirects, same shape as start_all.ps1 ---"
          Set-Content -Path C:\logs\diag_probe.py -Value "import sys`nprint('out-ok')`nprint('err-ok', file=sys.stderr)"
          $p = Start-Process -FilePath C:\miniconda3\python.exe -ArgumentList C:\logs\diag_probe.py `
                 -WorkingDirectory C:\virtual-try-on\tryon_backend `
                 -RedirectStandardOutput C:\logs\diag-py.log -RedirectStandardError C:\logs\diag-py.err.log `
                 -WindowStyle Hidden -PassThru
          $p.WaitForExit(30000) | Out-Null
          "pid $($p.Id) exited=$($p.HasExited) code=$($p.ExitCode)"
          "diag-py.log     : " + (Get-Content C:\logs\diag-py.log -Raw -ErrorAction SilentlyContinue)
          "diag-py.err.log : " + (Get-Content C:\logs\diag-py.err.log -Raw -ErrorAction SilentlyContinue)
          Get-Item C:\logs\diag-py*.log -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize | Out-String
          "--- ACLs ---"
          & icacls C:\miniconda3\python.exe 2>&1 | Out-String
          & icacls C:\virtual-try-on\tryon_backend 2>&1 | Select-Object -First 6 | Out-String
          & icacls C:\logs\try-on.err.log 2>&1 | Out-String

