<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCY AI — Live Try-On & Face Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
<style>
/* ╔═══════════════════════════════════════════════════════════════════╗
   ║  LUCY — Mirror's Edge inspired UI                                  ║
   ║  pure white · iconic red · sharp angles · condensed type           ║
   ╚═══════════════════════════════════════════════════════════════════╝ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F4E9D8;        /* warm parchment cream */
  --surface:   #FFFAF0;        /* lighter card cream */
  --ink:       #3D2817;        /* deep espresso brown */
  --ink-soft:  #5C3D24;        /* secondary brown */
  --muted:     #A89074;        /* warm tan */
  --border:    #D4B896;        /* aged beige */
  --accent:    #E5A823;        /* mustard / golden yellow */
  --accent-hot:#F5B82E;        /* brighter on hover */
  --accent-deep:#B8860B;       /* dark gold for shadows */
  --green:     #6B8E23;        /* olive (warm green) */
  --red:       #B5491A;        /* burnt sienna */
}

::selection { background: var(--accent); color: #fff; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-feature-settings: "ss01","cv11";
}

/* Vertical golden runner stripe down the left edge */
body::before {
  content: '';
  position: fixed;
  top: 56px; left: 0;
  width: 4px; bottom: 0;
  background: var(--accent);
  z-index: 100;
  pointer-events: none;
}

/* ══════ Header ══════ */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  background: var(--ink);
  color: var(--bg);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
  border-bottom: 4px solid var(--accent);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 4px;
  font-weight: 400;
  line-height: 1;
}
.logo-dot {
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 0;
  transform: rotate(45deg);
}
.tabs {
  display: flex;
  gap: 0;
  background: transparent;
  border: none;
  padding: 0;
  border-radius: 0;
}
.tab {
  padding: 0 22px;
  height: 56px;
  border: none;
  background: transparent;
  color: rgba(244,233,216,0.55);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  border-radius: 0;
  position: relative;
}
.tab:hover { color: var(--bg); }
.tab.active {
  color: var(--ink);
  background: var(--accent);
  box-shadow: none;
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 0; right: 0;
  height: 4px;
  background: var(--accent);
}

/* ══════ Layout ══════ */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 56px);
}

/* ══════ Sidebar ══════ */
.sidebar {
  width: 340px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 24px 20px;
  gap: 14px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: relative;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 0; }

.panel { display: none; flex-direction: column; gap: 14px; }
.panel.active { display: flex; }
.sticky-action {
  position: sticky;
  bottom: -24px;
  background: var(--surface);
  margin: 0 -20px -24px;
  padding: 14px 20px 24px;
  border-top: 2px solid var(--ink);
  z-index: 5;
}

/* ══════ Cards ══════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: 18px;
  position: relative;
  /* corner notch — Mirror's Edge signature */
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.card-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 3px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-label::before {
  content: '';
  width: 18px;
  height: 2px;
  background: var(--accent);
  display: inline-block;
}

/* ══════ Upload zone ══════ */
.upload-zone {
  border: 2px dashed var(--ink);
  border-radius: 0;
  padding: 18px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s, background 0.15s;
  min-height: 86px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  background: var(--surface);
}
.upload-zone:hover { border-color: var(--accent); background: #FFF6E0; }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-zone img { max-width: 100%; max-height: 110px; object-fit: cover; }
.upload-hint {
  font-size: 11px; color: var(--muted); pointer-events: none;
  font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
}
.upload-icon { font-size: 22px; pointer-events: none; }

/* ══════ Buttons ══════ */
.btn {
  width: 100%;
  padding: 13px;
  border-radius: 0;
  border: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  text-transform: uppercase;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn-primary {
  background: var(--accent);
  color: var(--ink);
  box-shadow: none;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hot); }
.btn-primary:disabled {
  background: #C9B98D; color: var(--surface); cursor: not-allowed;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn-stop  { background: var(--ink); color: var(--bg); }
.btn-stop:hover { background: var(--red); }
.btn-active { background: var(--ink); color: var(--bg); }
.btn-ghost {
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn-ghost:hover { background: var(--ink); color: var(--accent); }

/* ══════ Status row ══════ */
.status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.dot {
  width: 8px; height: 8px; background: var(--accent);
  flex-shrink: 0; transition: background 0.3s;
  transform: rotate(45deg);
}
.dot.on { background: var(--green); }

.status-msg {
  font-size: 11px; margin-top: 8px; padding: 10px 14px;
  display: none;
  border-left: 3px solid var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.status-msg.info    { border-color: var(--ink);    background: #EDE0CB; color: var(--ink);   display: block; }
.status-msg.success { border-color: var(--green);  background: #E6EBC9; color: #4D6614;     display: block; }
.status-msg.error   { border-color: var(--red);    background: #F8DCC4; color: #8C2F0F;     display: block; }

/* ══════ Avatar grid ══════ */
.cat-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.pill {
  padding: 6px 14px;
  border-radius: 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  border: 1px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.12s;
}
.pill.active { background: var(--ink); color: var(--accent); }
.pill:hover:not(.active) { background: var(--accent); border-color: var(--ink); color: var(--ink); }

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.av-card {
  border-radius: 0;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid var(--ink);
  transition: all 0.12s;
  aspect-ratio: 1;
  position: relative;
  background: var(--surface);
}
.av-card:hover { border-color: var(--accent); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.av-card.selected {
  border-color: var(--ink);
  box-shadow: 4px 4px 0 var(--accent);
  transform: translate(-2px, -2px);
}
.av-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-name {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--ink);
  font-size: 9px; text-align: center; padding: 4px;
  color: var(--accent);
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1.5px;
}
.av-check {
  position: absolute; top: 4px; right: 4px;
  width: 16px; height: 16px;
  background: var(--accent);
  display: none;
  align-items: center; justify-content: center;
  font-size: 10px; color: var(--ink);
  transform: rotate(45deg);
}
.av-card.selected .av-check { display: flex; }
.av-check span { transform: rotate(-45deg); display: block; font-weight: 700; }

/* ══════ Voice card ══════ */
.voice-card {
  display: none;
  background: var(--ink);
  color: var(--bg);
  border-radius: 0;
  padding: 18px;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.voice-avatar {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 12px;
  color: rgba(244,233,216,0.7);
}
.voice-avatar strong { color: var(--accent); font-weight: 400; }
.voice-btn {
  width: 100%;
  padding: 13px;
  border-radius: 0;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.12s;
  text-transform: uppercase;
}
.voice-btn:hover { background: var(--accent); color: var(--ink); }
.voice-btn.active { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.rec-pulse {
  width: 10px; height: 10px;
  background: var(--accent);
  display: none;
  animation: pulse 1s infinite;
  transform: rotate(45deg);
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
@keyframes spin  { to { transform: rotate(360deg) } }

/* ══════ Main canvas area ══════ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  position: relative;
  gap: 16px;
  background: var(--bg);
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
}
.canvas-wrap {
  width: 100%;
  max-width: 640px;
  position: relative;
  border-radius: 0;
  overflow: hidden;
  background: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: 10px 10px 0 var(--accent);
  aspect-ratio: 1;
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
.canvas-wrap canvas, .canvas-wrap video {
  width: 100%; height: 100%;
  display: block;
  object-fit: cover;
}
.canvas-overlay {
  position: absolute;
  top: 14px; left: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.overlay-badge {
  background: var(--ink);
  border: none;
  border-left: 3px solid var(--accent);
  border-radius: 0;
  padding: 6px 14px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 2.5px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ══════ Camera strip (legacy, unused) ══════ */
.cam-strip {
  width: 100%;
  max-width: 640px;
  height: 80px;
  border-radius: 0;
  overflow: hidden;
  border: 2px solid var(--ink);
  position: relative;
  background: #fff;
}
.cam-strip video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
.cam-strip-label {
  position: absolute;
  top: 8px; left: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  background: var(--accent);
  color: var(--ink);
  padding: 2px 8px;
}

/* ══════ Divider ══════ */
.divider {
  height: 2px;
  background: var(--ink);
  margin: 6px 0;
}

/* ══════ Placeholder ══════ */
#placeholder {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 4px;
  color: var(--muted);
}

/* ── Scrollbar ── */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    LUCY AI
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('liveswap')">Live Face Swap</button>
    <button class="tab" onclick="switchTab('tryon')">Live Try-On</button>
  </div>
  <div style="width:120px"></div>
</header>

<div class="app">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <div class="sidebar">

    <!-- LIVE FACE SWAP -->
    <div class="panel active" id="panel-liveswap">
      <!-- Step 1: Camera (always visible at top) -->
      <div class="card">
        <div class="card-label">Step 1 · Camera</div>
        <button class="btn btn-ghost" id="liveCamBtn" onclick="startLiveCamera()">📷 Start Camera</button>
      </div>

      <!-- Step 2: Avatar -->
      <div class="card">
        <div class="card-label">Step 2 · Choose Avatar</div>
        <div class="cat-pills">
          <button class="pill active" onclick="filterAvatars('all',this)">All</button>
          <button class="pill" onclick="filterAvatars('Women',this)">Women</button>
          <button class="pill" onclick="filterAvatars('Men',this)">Men</button>
        </div>
        <div class="avatar-grid" id="avatarGrid" style="max-height:230px;overflow-y:auto"></div>
        <div class="divider" style="margin-top:12px"></div>
        <div style="margin-top:10px;font-size:11px;color:var(--muted);margin-bottom:8px">Or upload your own</div>
        <div class="upload-zone" style="min-height:56px">
          <input type="file" accept="image/*" onchange="previewFile(this,'lsp','lsph');setLiveSourceFile(this)">
          <img id="lsp" style="display:none;max-height:50px">
          <span class="upload-hint" id="lsph">📁 Upload any face</span>
        </div>
      </div>

      <!-- Voice card -->
      <div class="voice-card" id="voiceCard">
        <div class="voice-avatar">🎭 Speaking as <strong id="voiceAvatarName">—</strong></div>
        <button class="voice-btn" id="voiceBtn" onclick="toggleRealtimeVoice()">
          <span class="rec-pulse" id="recDot"></span>
          <span id="voiceBtnLabel">🎤 Start Live Voice</span>
        </button>
        <div id="voiceStatus" class="status-msg"></div>
      </div>

      <!-- Step 3: Start (sticky to bottom of sidebar so always reachable) -->
      <div class="sticky-action">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div class="status-row" style="flex:1">
            <div class="dot" id="lsDot"></div>
            <span id="lsStatusText" style="font-size:12px">Not connected</span>
          </div>
        </div>
        <button class="btn btn-primary" id="liveSwapBtn" onclick="toggleLiveSwap()" disabled>Start Live Swap</button>
        <div id="liveStatus" class="status-msg"></div>
      </div>
    </div>

    <!-- LIVE TRY-ON -->
    <div class="panel" id="panel-tryon">
      <div class="card">
        <div class="card-label">Garment / Clothing</div>
        <div class="upload-zone">
          <input type="file" accept="image/*" onchange="previewFile(this,'gp','gph');setGarment(this)">
          <img id="gp" style="display:none;max-height:100px">
          <span class="upload-icon" id="gph">👕</span>
          <span class="upload-hint" id="gph2">Upload shirt, jacket, dress</span>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Camera</div>
        <button class="btn btn-ghost" id="tryonCamBtn" onclick="startTryOnCamera()">📷 Start Camera</button>
      </div>
      <div style="display:flex;gap:8px">
        <div class="status-row" style="flex:1">
          <div class="dot" id="toDot"></div>
          <span id="toStatusText" style="font-size:12px">Not connected</span>
        </div>
      </div>
      <button class="btn btn-primary" id="tryonBtn" onclick="toggleTryOn()" disabled>Start Live Try-On</button>
      <div id="tryonStatus" class="status-msg"></div>
    </div>

  </div>

  <!-- ══════════════ MAIN DISPLAY ══════════════ -->
  <div class="main">

    <!-- Live face swap: camera + result side by side -->
    <div id="liveWrap" style="display:none;width:100%">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:1100px">
        <div class="canvas-wrap" style="max-width:100%">
          <video id="liveVideo" autoplay muted playsinline style="transform:scaleX(-1)"></video>
          <div class="canvas-overlay">
            <div class="overlay-badge">📷 Your Camera</div>
          </div>
        </div>
        <div class="canvas-wrap" style="max-width:100%;position:relative">
          <canvas id="liveCanvas"></canvas>
          <div class="canvas-overlay">
            <div class="overlay-badge">
              <div class="dot" id="lsDot2"></div>
              <span id="lsLabel">Face Swapped</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Live try-on: camera + result side by side -->
    <div id="tryonWrap" style="display:none;width:100%;display:none">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:1100px">
        <div class="canvas-wrap" style="max-width:100%">
          <video id="tryonVideo" autoplay muted playsinline style="transform:scaleX(-1)"></video>
          <div class="canvas-overlay">
            <div class="overlay-badge">📷 Your Camera</div>
          </div>
        </div>
        <div class="canvas-wrap" style="max-width:100%;position:relative">
          <canvas id="tryonCanvas"></canvas>
          <div class="canvas-overlay">
            <div class="overlay-badge">
              <div class="dot" id="toDot2"></div>
              <span>Live Result</span>
            </div>
          </div>
          <!-- Processing spinner — visible while CatVTON is running -->
          <div id="toSpinner" style="display:none;position:absolute;inset:0;
               background:rgba(0,0,0,0.45);border-radius:12px;
               display:none;align-items:center;justify-content:center;
               flex-direction:column;gap:10px;pointer-events:none">
            <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);
                 border-top-color:#a78bfa;border-radius:50%;
                 animation:spin 0.8s linear infinite"></div>
            <span style="color:#e2e8f0;font-size:12px;font-weight:500" id="toSpinnerMs"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Placeholder -->
    <div id="placeholder" style="display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="width:64px;height:64px;background:var(--accent);transform:rotate(45deg)"></div>
      <div style="font-size:18px;letter-spacing:6px;color:var(--ink)">SELECT A MODE</div>
      <div style="font-size:12px;letter-spacing:3px;color:var(--muted)">LIVE FACE SWAP &nbsp;·&nbsp; LIVE TRY-ON</div>
    </div>

  </div>
</div>

<script>
const FACE_API = 'http://13.203.75.149:7860';
const TRYON_WS = 'ws://13.203.75.149:8000/ws/tryon';
const SWAP_WS  = 'ws://13.203.75.149:7860/ws/live-swap';

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(t) {
  ['liveswap','tryon'].forEach((id,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', id===t);
    document.getElementById('panel-'+id).classList.toggle('active', id===t);
  });
  document.getElementById('liveWrap').style.display    = t==='liveswap' ? 'grid' : 'none';
  document.getElementById('tryonWrap').style.display   = t==='tryon'    ? 'grid' : 'none';
  document.getElementById('placeholder').style.display = 'none';
}

function previewFile(inp, imgId, phId) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    const img = document.getElementById(imgId);
    img.src = e.target.result; img.style.display = 'block';
    const ph = document.getElementById(phId);
    if (ph) ph.style.display = 'none';
    const ph2 = document.getElementById(phId+'2');
    if (ph2) ph2.style.display = 'none';
  };
  r.readAsDataURL(f);
}

function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status-msg ' + (type==='loading'?'info':type);
  el.textContent = msg;
}

function setDot(prefix, on) {
  ['','2'].forEach(sfx => {
    const d = document.getElementById(prefix+'Dot'+sfx);
    if (d) d.className = 'dot' + (on?' on':'');
  });
  const lbl = document.getElementById(prefix+'StatusText');
  if (lbl) lbl.textContent = on ? 'Connected' : 'Disconnected';
}

// ── Off-screen canvases ────────────────────────────────────────────────────────
const _lsCvs = document.createElement('canvas');
const _lsCtx = _lsCvs.getContext('2d');
const _toCvs = document.createElement('canvas');
const _toCtx = _toCvs.getContext('2d');

// ── Avatar Picker ──────────────────────────────────────────────────────────────
let _allAvatars = [], _selectedAvatar = null;

async function loadAvatars() {
  try {
    const res  = await fetch(`${FACE_API}/avatars`);
    const data = await res.json();
    _allAvatars = data.avatars;
    renderAvatars(_allAvatars);
  } catch(e) { console.warn('Avatar load failed:', e); }
}

function renderAvatars(list) {
  document.getElementById('avatarGrid').innerHTML = list.map(a => `
    <div class="av-card${_selectedAvatar===a.id?' selected':''}" id="av_${a.id}" onclick="selectAvatar('${a.id}')">
      <img src="${FACE_API}${a.image_url}" loading="lazy" onerror="this.src=''">
      <div class="av-name">${a.name}</div>
      <div class="av-check"><span>✓</span></div>
    </div>`).join('');
}

function filterAvatars(cat, btn) {
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAvatars(cat==='all' ? _allAvatars : _allAvatars.filter(a=>a.category===cat));
}

function selectAvatar(id) {
  _selectedAvatar = id;
  const activeBtn = document.querySelector('.pill.active');
  const activeCat = activeBtn ? activeBtn.textContent : 'All';
  renderAvatars(activeCat==='All' ? _allAvatars : _allAvatars.filter(a=>a.category===activeCat));

  const av = _allAvatars.find(a=>a.id===id);
  if (!av) return;

  document.getElementById('lsp').src = `${FACE_API}/avatars/${id}/image`;
  document.getElementById('lsp').style.display = 'block';
  document.getElementById('lsph').style.display = 'none';
  liveSource = { avatar_id: id };
  checkLiveReady();
  setStatus('liveStatus','success',`${av.name} selected`);

  document.getElementById('voiceCard').style.display = 'block';
  document.getElementById('voiceAvatarName').textContent = av.name;
  _resetVoiceUI();
}

function setLiveSourceFile(inp) {
  _selectedAvatar = null;
  document.querySelectorAll('.av-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('voiceCard').style.display = 'none';
  _resetVoiceUI();
  const reader = new FileReader();
  reader.onload = e => { liveSource = e.target.result.split(',')[1]; checkLiveReady(); };
  reader.readAsDataURL(inp.files[0]);
}

loadAvatars();

// ── Real-time Voice ────────────────────────────────────────────────────────────
let _voiceMic=null, _voicePitch=null, _voiceActive=false;
const _VOICE_SEMITONES = {
  'cel_f':2,'cel_m':-2,'ai_':0,'ani_f':8,'ani_m':5,'fan_f':3,'fan_m':-5
};
function _getSemitones(id) {
  for (const [k,v] of Object.entries(_VOICE_SEMITONES)) {
    if (id&&id.startsWith(k)) return v;
  }
  return 0;
}
function _resetVoiceUI() {
  stopRealtimeVoice();
  document.getElementById('voiceBtnLabel').textContent = '🎤 Start Live Voice';
  document.getElementById('recDot').style.display = 'none';
  document.getElementById('voiceBtn').classList.remove('active');
  const st = document.getElementById('voiceStatus');
  if (st) { st.className='status-msg'; st.textContent=''; }
}
async function toggleRealtimeVoice() {
  _voiceActive ? stopRealtimeVoice() : await startRealtimeVoice();
}
async function startRealtimeVoice() {
  if (!_selectedAvatar) { setStatus('voiceStatus','error','Select an avatar first'); return; }
  if (typeof Tone==='undefined') { setStatus('voiceStatus','error','Audio engine loading…'); return; }
  try {
    await Tone.start();
    const semitones = _getSemitones(_selectedAvatar);
    _voiceMic   = new Tone.UserMedia();
    _voicePitch = new Tone.PitchShift({ pitch:semitones, windowSize:0.1 });
    if (_selectedAvatar.startsWith('ai_')) {
      const tremolo = new Tone.Tremolo({frequency:10,depth:0.6}).start();
      _voiceMic.connect(_voicePitch); _voicePitch.connect(tremolo); tremolo.toDestination();
    } else if (_selectedAvatar.startsWith('fan_f')) {
      const reverb = new Tone.Reverb({decay:2.5,wet:0.4});
      _voiceMic.connect(_voicePitch); _voicePitch.connect(reverb); reverb.toDestination();
    } else {
      _voiceMic.connect(_voicePitch); _voicePitch.toDestination();
    }
    await _voiceMic.open();
    _voiceActive = true;
    document.getElementById('voiceBtnLabel').textContent = '⏹ Stop Voice';
    document.getElementById('recDot').style.display = 'inline-block';
    document.getElementById('voiceBtn').classList.add('active');
    const av = _allAvatars.find(a=>a.id===_selectedAvatar);
    setStatus('voiceStatus','success',`Live: ${av?.name||''} (${semitones>0?'+':''}${semitones} semitones)`);
  } catch(e) { setStatus('voiceStatus','error','Mic error: '+e.message); }
}
function stopRealtimeVoice() {
  if (_voiceMic)   { try{_voiceMic.close();_voiceMic.disconnect();}catch(_){} _voiceMic=null; }
  if (_voicePitch) { try{_voicePitch.disconnect();}catch(_){} _voicePitch=null; }
  _voiceActive=false;
  document.getElementById('voiceBtnLabel').textContent='🎤 Start Live Voice';
  document.getElementById('recDot').style.display='none';
  document.getElementById('voiceBtn').classList.remove('active');
}

// ── Live Face Swap ─────────────────────────────────────────────────────────────
let liveStream=null,liveWs=null,liveSource=null,liveRunning=false;
let liveLatestResult=null,liveRafId=null,liveSendTimer=null;

function checkLiveReady() {
  if (liveSource && liveStream) document.getElementById('liveSwapBtn').disabled=false;
}
async function startLiveCamera() {
  try {
    liveStream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
    document.getElementById('liveVideo').srcObject = liveStream;
    const btn = document.getElementById('liveCamBtn');
    btn.textContent='✅ Camera On'; btn.className='btn btn-active';
    checkLiveReady();
    document.getElementById('liveCamStrip').style.display='block';
  } catch(e) { alert('Camera error: '+e.message); }
}
function toggleLiveSwap() { liveRunning ? stopLiveSwap() : startLiveSwap(); }
function startLiveSwap() {
  if (!liveSource) { setStatus('liveStatus','error','Select a face first'); return; }
  liveLatestResult=null;
  liveWs = new WebSocket(SWAP_WS);
  liveWs.onopen = () => {
    setDot('ls',true);
    const initMsg = (liveSource&&liveSource.avatar_id)
      ? {type:'init',avatar_id:liveSource.avatar_id}
      : {type:'init',source_image:liveSource};
    liveWs.send(JSON.stringify(initMsg));
    document.getElementById('liveSwapBtn').textContent='⏹ Stop';
    document.getElementById('liveSwapBtn').className='btn btn-stop';
    liveRunning=true;
  };
  liveWs.onmessage = e => {
    const msg=JSON.parse(e.data);
    if (msg.type==='ready') {
      setStatus('liveStatus','success','Live swap active');
      _startLsRender(); _startLsTimer(); sendLiveFrame();
    } else if (msg.type==='result') {
      const img=new Image();
      img.onload=()=>{ liveLatestResult=img; };
      img.src='data:image/jpeg;base64,'+msg.image;
      sendLiveFrame();
    } else if (msg.type==='no_face'||msg.type==='dropped') {
      sendLiveFrame();
    } else if (msg.type==='error') {
      setStatus('liveStatus','error',msg.message);
    }
  };
  liveWs.onclose=()=>{ setDot('ls',false); _stopLsTimer(); _stopLsRender(); liveRunning=false; };
  liveWs.onerror=()=>{ setStatus('liveStatus','error','Connection error'); stopLiveSwap(); };
}
function stopLiveSwap() {
  if (liveWs) liveWs.close();
  _stopLsTimer(); _stopLsRender(); liveRunning=false;
  document.getElementById('liveSwapBtn').textContent='Start Live Swap';
  document.getElementById('liveSwapBtn').className='btn btn-primary';
}
function _startLsTimer() {
  if (liveSendTimer) clearInterval(liveSendTimer);
  liveSendTimer=setInterval(sendLiveFrame,100);
}
function _stopLsTimer() { if(liveSendTimer){clearInterval(liveSendTimer);liveSendTimer=null;} }
function _startLsRender() {
  if (liveRafId) cancelAnimationFrame(liveRafId);
  const canvas=document.getElementById('liveCanvas');
  const video=document.getElementById('liveVideo');
  const ctx=canvas.getContext('2d');
  (function render(){
    const vw=video.videoWidth||480,vh=video.videoHeight||480;
    const sz=Math.min(vw,vh);
    if(canvas.width!==sz||canvas.height!==sz){canvas.width=sz;canvas.height=sz;}
    if(liveLatestResult){ ctx.drawImage(liveLatestResult,0,0,sz,sz); }
    else if(video.readyState>=2){ ctx.drawImage(video,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,sz,sz); }
    if(liveRunning) liveRafId=requestAnimationFrame(render);
  })();
}
function _stopLsRender(){if(liveRafId){cancelAnimationFrame(liveRafId);liveRafId=null;}}
function sendLiveFrame() {
  if(!liveWs||liveWs.readyState!==WebSocket.OPEN) return;
  const video=document.getElementById('liveVideo');
  const vw=video.videoWidth||640,vh=video.videoHeight||480;
  const sz=Math.min(vw,vh,320);
  if(_lsCvs.width!==sz){_lsCvs.width=sz;_lsCvs.height=sz;}
  _lsCtx.drawImage(video,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,sz,sz);
  liveWs.send(JSON.stringify({type:'frame',image:_lsCvs.toDataURL('image/jpeg',0.80).split(',')[1]}));
}

// ── Live Try-On ────────────────────────────────────────────────────────────────
let toStream=null,toWs=null,toGarment=null,toRunning=false;
let toLatestResult=null,toRafId=null,toSendTimer=null;

function setGarment(inp) {
  toGarment=inp.files[0];
  if(toGarment) document.getElementById('tryonBtn').disabled=false;
}
async function startTryOnCamera() {
  try {
    toStream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
    document.getElementById('tryonVideo').srcObject=toStream;
    const btn=document.getElementById('tryonCamBtn');
    btn.textContent='✅ Camera On'; btn.className='btn btn-active';
  } catch(e) { alert('Camera error: '+e.message); }
}
function toggleTryOn() { toRunning ? stopTryOn() : startTryOn(); }
let toProcessing=false, toFrameSentAt=0;
function _toSpinner(on){
  const el=document.getElementById('toSpinner');
  el.style.display=on?'flex':'none';
}
function startTryOn() {
  if(!toStream) { setStatus('tryonStatus','error','Start camera first'); return; }
  if(!toGarment) { setStatus('tryonStatus','error','Upload garment first'); return; }
  toLatestResult=null; toProcessing=false;
  toWs=new WebSocket(TRYON_WS);
  toWs.onopen=()=>{
    setDot('to',true);
    const r=new FileReader();
    r.onload=e=>toWs.send(JSON.stringify({type:'init',garment_image:e.target.result.split(',')[1]}));
    r.readAsDataURL(toGarment);
    document.getElementById('tryonBtn').textContent='⏹ Stop';
    document.getElementById('tryonBtn').className='btn btn-stop';
    toRunning=true;
  };
  toWs.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='ready'){
      setStatus('tryonStatus','success','Try-on active');
      _startToRender(); _startToTimer(); sendToFrame();
    } else if(msg.type==='result'){
      const ms=Date.now()-toFrameSentAt;
      document.getElementById('toSpinnerMs').textContent=ms+'ms';
      toProcessing=false; _toSpinner(false);
      const img=new Image();
      img.onload=()=>{ toLatestResult=img; };
      img.src='data:image/jpeg;base64,'+msg.image;
      sendToFrame();
    } else if(msg.type==='dropped') {
      toProcessing=false; _toSpinner(false);
      sendToFrame();
    } else if(msg.type==='error') {
      toProcessing=false; _toSpinner(false);
      setStatus('tryonStatus','error',msg.message);
    }
  };
  toWs.onclose=()=>{ setDot('to',false); _stopToTimer(); _stopToRender(); toRunning=false; _toSpinner(false); };
  toWs.onerror=()=>{ setStatus('tryonStatus','error','Connection error'); stopTryOn(); };
}
function stopTryOn() {
  if(toWs) toWs.close();
  _stopToTimer(); _stopToRender(); toRunning=false;
  document.getElementById('tryonBtn').textContent='Start Live Try-On';
  document.getElementById('tryonBtn').className='btn btn-primary';
}
function _startToTimer(){if(toSendTimer)clearInterval(toSendTimer);toSendTimer=setInterval(sendToFrame,1500);}
function _stopToTimer(){if(toSendTimer){clearInterval(toSendTimer);toSendTimer=null;}}
function _startToRender(){
  if(toRafId) cancelAnimationFrame(toRafId);
  const canvas=document.getElementById('tryonCanvas');
  const video=document.getElementById('tryonVideo');
  const ctx=canvas.getContext('2d');
  (function render(){
    const vw=video.videoWidth||480,vh=video.videoHeight||480;
    const sz=Math.min(vw,vh);
    if(canvas.width!==sz||canvas.height!==sz){canvas.width=sz;canvas.height=sz;}
    if(toLatestResult){ ctx.drawImage(toLatestResult,0,0,sz,sz); }
    else if(video.readyState>=2){ ctx.drawImage(video,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,sz,sz); }
    if(toRunning) toRafId=requestAnimationFrame(render);
  })();
}
function _stopToRender(){if(toRafId){cancelAnimationFrame(toRafId);toRafId=null;}}
function sendToFrame(){
  if(!toWs||toWs.readyState!==WebSocket.OPEN) return;
  const video=document.getElementById('tryonVideo');
  const vw=video.videoWidth||640,vh=video.videoHeight||480;
  const sz=Math.min(vw,vh);
  if(_toCvs.width!==sz){_toCvs.width=sz;_toCvs.height=sz;}
  _toCtx.drawImage(video,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,sz,sz);
  toProcessing=true; toFrameSentAt=Date.now();
  // Only show spinner if no result yet (first frame) to avoid flash on fast GPU
  if(!toLatestResult) _toSpinner(true);
  toWs.send(JSON.stringify({type:'frame',image:_toCvs.toDataURL('image/jpeg',0.85).split(',')[1]}));
}

// Pause when tab hidden
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(liveSendTimer){clearInterval(liveSendTimer);liveSendTimer=null;}
    if(toSendTimer){clearInterval(toSendTimer);toSendTimer=null;}
  } else {
    if(liveRunning) _startLsTimer();
    if(toRunning)   _startToTimer();
  }
});

switchTab('liveswap');
</script>
